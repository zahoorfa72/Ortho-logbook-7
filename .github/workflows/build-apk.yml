name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.1.12297006"
  ORG_GRADLE_PROJECT_reactNativeArchitectures: "arm64-v8a"
  EXPO_PUBLIC_USE_RN_FETCH: "1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check repository layout
        run: |
          set -euo pipefail
          test -f frontend/package.json
          if [ ! -f frontend/yarn.lock ]; then
            echo "::warning::frontend/yarn.lock is missing; will install without a lockfile."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare Android SDK + install required NDK
        run: |
          set -euo pipefail
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true

          # GitHub-hosted runners occasionally receive a truncated NDK ZIP.
          # Retry cleanly and remove partial SDK downloads before each retry.
          installed=false
          for attempt in 1 2 3; do
            echo "Installing NDK/CMake (attempt $attempt of 3)"
            if "$SDKMAN" --install "ndk;${NDK_VERSION}" "cmake;3.22.1"; then
              NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"
              CMAKE_DIR="$ANDROID_HOME/cmake/3.22.1"
              if [ -f "$NDK_DIR/source.properties" ] && [ -f "$CMAKE_DIR/bin/cmake" ]; then
                installed=true
                break
              fi
            fi
            echo "SDK install was incomplete; cleaning partial NDK/CMake downloads before retry."
            rm -rf "$ANDROID_HOME/ndk/${NDK_VERSION}" "$ANDROID_HOME/cmake/3.22.1"
            rm -rf "$ANDROID_HOME/temp/"* "$HOME/.android/cache/"*
            sleep $((attempt * 10))
          done
          if [ "$installed" != true ]; then
            echo "::error::Android NDK/CMake installation failed after 3 attempts."
            exit 1
          fi

          {
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
          } >> "$GITHUB_ENV"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install JS dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --ignore-scripts
          else
            yarn install --ignore-scripts
          fi

      - name: Prepare ONNX Runtime for Expo 57
        working-directory: frontend
        run: |
          set -euo pipefail
          ORT_DIR="node_modules/onnxruntime-react-native"
          test -d "$ORT_DIR"
          # Expo's autolinker misclassifies this React Native native module if
          # its legacy unimodule marker is present. Community autolinking then
          # registers OnnxruntimePackage correctly.
          rm -f "$ORT_DIR/unimodule.json"
          # ORT 1.24.3 still references Gradle's removed VersionNumber class.
          # Patch only that compatibility check; leave model/runtime code intact.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("node_modules/onnxruntime-react-native/android/build.gradle")
          s = p.read_text()
          lines = s.splitlines()
          patched = False
          for index, line in enumerate(lines):
              if "VersionNumber.parse(REACT_NATIVE_VERSION)" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + 'def rnVersionParts = REACT_NATIVE_VERSION.split("\\\\.")'
                  lines.insert(index + 1, indent + 'if (rnVersionParts[0].toInteger() == 0 && rnVersionParts[1].toInteger() < 71) {')
                  patched = True
                  break
          s = "\\n".join(lines) + "\\n"
          if not patched and "VersionNumber.parse(REACT_NATIVE_VERSION)" in s:
              raise SystemExit("Could not locate ONNX Runtime Gradle compatibility check")
          if "VersionNumber.parse(REACT_NATIVE_VERSION)" in s:
              raise SystemExit("ONNX Runtime Gradle compatibility check remains unpatched")
          p.write_text(s)
          PY

      - name: TypeScript validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Generate native Android project
        working-directory: frontend
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install --non-interactive --clean

      - name: Force NDK version in gradle.properties
        run: |
          set -euo pipefail
          PROPS=frontend/android/gradle.properties
          {
            echo ""
            echo "android.ndkVersion=${NDK_VERSION}"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=false"
            echo "org.gradle.caching=true"
            echo "org.gradle.configureondemand=false"
          } >> "$PROPS"

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/ortho-logbook-release.jks
          test -s frontend/android/app/ortho-logbook-release.jks

          KEYSTORE="$GITHUB_WORKSPACE/frontend/android/app/ortho-logbook-release.jks"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'Alias name:|SHA1:|SHA256:'

          GRADLE_FILE=frontend/android/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path("frontend/android/app/build.gradle")
          s = p.read_text()
          marker = "signingConfigs {"
          if marker in s and "orthoLogbookRelease" not in s:
              s = s.replace(
                  marker,
                  """signingConfigs {
                  orthoLogbookRelease {
                      storeFile file("ortho-logbook-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }""",
                  1
              )
          s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.orthoLogbookRelease")
          p.write_text(s)
          PY

          grep -q "signingConfig signingConfigs.orthoLogbookRelease" "$GRADLE_FILE"

      - name: Build release APK
        working-directory: frontend/android
        env:
          NDK_CCACHE: /usr/bin/ccache
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f frontend/android/app/ortho-logbook-release.jks

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          APKS=(frontend/android/app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          cp "${APKS[0]}" out/ortho-logbook.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ortho-logbook-apk
          path: out/ortho-logbook.apk
          if-no-files-found: error
          retention-days: 14
